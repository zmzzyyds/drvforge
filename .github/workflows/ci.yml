name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: lint & pytest
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check src tests

      - name: Pytest
        run: pytest -v

  build-modules:
    name: generated drivers build against real kernel
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install drvforge
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Install kernel headers and toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential "linux-headers-$(uname -r)"

      - name: Generate every template
        run: |
          drvforge new demo-misc -t misc -c drvforge,demo-misc -d generated
          drvforge new demo-cdev -t platform-cdev -c drvforge,demo-cdev -d generated
          drvforge new demo-temp -t iio-temp -c drvforge,demo-temp -d generated

      - name: Build kernel modules
        run: |
          make -C generated/demo_misc
          make -C generated/demo_cdev
          # The cloud kernel is built without IIO, so the IIO template's
          # symbols cannot resolve at modpost time. KBUILD_MODPOST_WARN still
          # fully compiles the driver and reports unresolved symbols as
          # warnings; on kernels with CONFIG_IIO it builds and loads normally.
          make -C generated/demo_temp KBUILD_MODPOST_WARN=1

      - name: Build userspace test clients
        run: |
          make -C generated/demo_misc tools/test
          make -C generated/demo_cdev tools/test
          make -C generated/demo_temp tools/test

      - name: Smoke-load modules into the running kernel
        run: |
          set -eux
          # Self-contained platform drivers must always load.
          for pair in demo_misc/demo_misc demo_cdev/demo_cdev; do
            dir="${pair%/*}"
            mod="${pair#*/}"
            sudo insmod "generated/${dir}/${mod}.ko"
            lsmod | grep "${mod}"
            sudo rmmod "${mod}"
          done
          # The IIO template additionally needs the IIO/regmap-I2C modules;
          # cloud kernels may not ship them, in which case skip only this load.
          if modinfo industrialio >/dev/null 2>&1 && \
             modinfo regmap-i2c >/dev/null 2>&1; then
            sudo modprobe industrialio
            sudo modprobe regmap-i2c
            sudo insmod generated/demo_temp/demo_temp.ko
            lsmod | grep demo_temp
            sudo rmmod demo_temp
          else
            echo "IIO stack unavailable on this kernel; skipping demo_temp load"
          fi

      - name: Check platform DT overlays against a real QEMU virt tree
        run: |
          sudo apt-get install -y device-tree-compiler qemu-system-arm
          # Compiling an overlay proves only that it is syntactically valid:
          # dtc resolves the fragment's target path at merge time, so a target
          # the tree does not have (a &{/soc} node, say) still exits 0. Dump
          # the tree QEMU would boot with, merge each overlay into it, and
          # check a node actually landed.
          # The i2c overlay is skipped: it references a board label (&i2c0) and
          # needs a board DTB rather than the generic virt tree.
          qemu-system-aarch64 -M virt,dumpdtb=virt.dtb \
            -cpu cortex-a57 -m 512 -smp 2 -display none
          # Count only real nodes. dtc -@ also emits a __symbols__ node, and
          # counting that would let the check pass without a device node ever
          # landing in the tree.
          count_nodes() { fdtget -l "$1" / | grep -vc '^__'; }
          n_before=$(count_nodes virt.dtb)
          for f in generated/demo_misc/*-overlay.dts \
                   generated/demo_cdev/*-overlay.dts; do
            dtc -O dtb -@ -o overlay.dtbo "$f"
            fdtoverlay -i virt.dtb -o merged.dtb overlay.dtbo
            n_after=$(count_nodes merged.dtb)
            test "$n_after" -gt "$n_before"
          done
